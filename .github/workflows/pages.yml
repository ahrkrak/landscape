name: Build GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'landscape.yml'
      - 'hosted_logos/**'
      - 'sources/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ensure docs dir exists
        run: mkdir -p docs

      - name: Build site (Landscape2 via docker run)
        run: |
          docker pull ghcr.io/cncf/landscape2:latest
          docker run --rm \
            --user 0:0 \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            ghcr.io/cncf/landscape2:latest \
            landscape2 build \
              --data-file landscape.yml \
              --settings-file sources/settings.yml \
              --guide-file sources/guide.yml \
              --games-file sources/games.yml \
              --logos-path hosted_logos \
              --output-dir docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
